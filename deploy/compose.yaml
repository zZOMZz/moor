services:
  relay:
    build: ../release/relay
    restart: unless-stopped
    environment:
      MOOR_ORIGIN: https://${MOOR_DOMAIN}
      MOOR_WEB_PUSH_PUBLIC_KEY: ${MOOR_WEB_PUSH_PUBLIC_KEY:-}
      MOOR_WEB_PUSH_PRIVATE_KEY: ${MOOR_WEB_PUSH_PRIVATE_KEY:-}
      MOOR_WEB_PUSH_SUBJECT: ${MOOR_WEB_PUSH_SUBJECT:-}
      MOOR_GOOGLE_CLIENT_ID: ${MOOR_GOOGLE_CLIENT_ID:-}
      MOOR_GOOGLE_CLIENT_SECRET: ${MOOR_GOOGLE_CLIENT_SECRET:-}
    volumes:
      - relay-data:/data
    expose:
      - '3078'
  https:
    image: caddy:2@sha256:14a9c00d4e833ebc2b65d36515b37bde3b73f0b323a2663aaafc88953d8c4e3f
    restart: unless-stopped
    environment:
      MOOR_DOMAIN: ${MOOR_DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - relay
volumes:
  relay-data:
  caddy-data:
  caddy-config:
